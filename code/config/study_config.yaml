# Study-wide settings. Thresholds follow the analysis plan (framework section 4.6); change here, not in code.
waves: [0, 1, 2, 3]
burst_days: 14
n_core: 300

segments_seconds: {adaptation: 300, rest: 300, task: 300, recovery: 300}   # the EEG block between rest and task is ended by the experimenter

lab: {window_hours: [14, 18], session_minutes: 90, n_labs: 2, weekdays_per_wave: 20}

ecg:
  sampling_rate_hz: 1000
  lead: II
  hardware_filters_hz: {high_pass: 1.0, low_pass: 150, notch: 50}
  max_corrected_beats_pct: 5.0
  hf_band_hz: [0.15, 0.40]
  review: {corrected_beats_pct: 3.0, hr_bpm: [45, 110], rmssd_ms: [8, 180]}

safety:   # framework 4.8; thresholds wait for the clinical team
  phq9_item9_min: 1
  cssrs_intensity_min: 12
  ema_ideation_min: 2

eeg:
  amplifier: Brain Products actiCHamp Plus, actiCAP slim 32   # recorded with BrainVision Recorder
  recorded_sampling_rate_hz: 1000
  analysis_sampling_rate_hz: 250
  online_reference: FCz     # confirm against the delivered cap layout; restored as an active channel offline
  n_channels: 32
  max_impedance_kohm: 30
  trigger_codes: {eyes_open: 1, eyes_closed: 2, block_end: 9}
  rest_condition_seconds: 240
  bandpass_hz: [1.0, 45.0]
  epoch_seconds: 2.0
  reject_peak_to_peak_uv: 150
  min_clean_seconds: 180
  max_data_loss_pct: 5.0
  max_interpolated_channels: 5
  ica_max_components: 25
  posterior_roi: [Pz, P3, P4, P7, P8, O1, Oz, O2]
  faa_pair: [F4, F3]
  fooof_freq_range: [2, 40]
  alpha_band_hz: [8, 13]

wearable:
  min_sleep_minutes: 180
  min_valid_nights_per_burst: 5
  # Oura API v2 sleep document fields; confirm against current official docs before first use
  oura_api_url: "https://api.ouraring.com/v2/usercollection/sleep"
  oura_fields: {day: day, type: type, hrv: average_hrv, hr: average_heart_rate, duration_s: total_sleep_duration}
  oura_main_sleep_type: long_sleep

passive:
  night_hours: [0, 6]
  location_grid_m: 100

scales:
  # item prefix: [n_items, min_response, summary]
  academic_stress: {prefix: acad, n: 5, summary: mean}
  employment_anxiety: {prefix: emp, n: 6, summary: mean}
  interpersonal_stress: {prefix: inter, n: 5, summary: mean}
  phq9_total: {prefix: phq, n: 9, summary: sum}
  gad7_total: {prefix: gad, n: 7, summary: sum}
  dass_stress: {prefix: dass, n: 7, summary: sum, multiplier: 2}
  sam_challenge: {prefix: sam, n: 4, summary: mean}
  stress_mindset: {prefix: smm, n: 8, summary: mean}
  erq_reappraisal: {prefix: erq, n: 6, summary: mean}
  ders16_total: {prefix: ders, n: 16, summary: sum}
  # Items reverse-keyed in the chosen Chinese versions, e.g. {smm_2: [0, 4]}; fill in once versions are fixed
  reverse_items: {}

subclinical_state: {phq9_cut: 10, gad7_cut: 10}
